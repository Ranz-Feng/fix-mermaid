<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixMermaid 本地工具</title>
<!-- 所有依赖从本地 node_modules 加载，不访问 CDN。 -->
<script src="../node_modules/d3/dist/d3.min.js"></script>
<script src="../node_modules/katex/dist/katex.min.js"></script>
<script src="../node_modules/markmap-lib/dist/browser/index.iife.js"></script>
<script src="../node_modules/markmap-view/dist/browser/index.js"></script>
<style>
  :root { --ink:#1D2433; --muted:#5B6475; --line:#D9DEE7; --accent:#3346B8; --bg:#F5F7FA; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.7fr); gap: 16px; align-items: start; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid var(--line); padding: 16px; }
  textarea { width: 100%; height: 520px; font: 13px/1.5 Menlo, Consolas, monospace; padding: 10px; border: 1px solid var(--line); resize: vertical; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; align-items: center; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .panel-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fixed-src-panel { margin-top: 10px; }
  .fixed-src-panel[hidden] { display: none; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #log { font-size: 13px; color: var(--muted); margin: 8px 0 0; padding-left: 18px; }
  .result-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .panel-head h2 { font-size: 15px; margin: 0; }
  .before h2 { color: #B42318; } .after h2 { color: #1F7A4D; }
  .state { font-size: 13px; color: var(--muted); }
  .mermaid-raw-error { background: #FEF3F2; border: 1px solid #FDA29B; color: #912018; padding: 10px; margin: 0;
                       font: 12px/1.5 Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }

  .intro { color: var(--muted); margin-top: -8px; }
  button:disabled { opacity: .5; cursor: wait; }
  .after { position: relative; }
  #out { height: 620px; background: white; }
  #out > svg { width: 100%; height: 100%; font: 20px "Microsoft YaHei",sans-serif; }
  .after:fullscreen { padding: 24px; overflow: auto; background: white; }
  .after:fullscreen #out { height: calc(100vh - 100px); }
  .mermaid-syntax-error { display: inline-block; color: #B42318; background: #FEF3F2; padding: 5px 12px; }
  #fixedSrc { white-space: pre-wrap; word-break: break-word; }
  @media (max-width: 800px) { textarea { height: 280px; } #out { height: 480px; } }

  /* 渲染容器与降级样式 —— 集成到项目时带上这部分 */
  .mermaid-block { min-height: 80px; overflow-x: auto; }
  .mermaid-block svg { max-width: 100%; height: auto; }
  .mermaid-placeholder { color: var(--muted); padding: 24px; text-align: center; }
  .mermaid-fallback-tip { font-size: 13px; color: #9A4A00; margin-bottom: 6px; }
  .mermaid-fallback-copy { font-size: 12px; padding: 2px 8px; margin-bottom: 6px; }
  .mermaid-fallback-code { background: #F5F7FA; border: 1px solid var(--line); padding: 10px; font: 12px/1.5 Menlo, Consolas, monospace; overflow-x: auto; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>fixMermaid 本地工具</h1>
  <p class="intro">粘贴 Mermaid 源码，一键修复并渲染：脑图输出左→右树形大纲，流程图、甘特图、时序图、饼图、XY 图保持原生样式。</p>
  <div class="grid">
    <section class="card">
      <div class="bar">
        <button class="primary" id="render" disabled>修复 Mermaid 图表</button>
        <button type="button" id="sample">加载脑图示例</button>
        <select id="example" aria-label="其他图表示例">
          <option value="">加载其他图表示例…</option>
          <option value="flowchart">流程图</option>
          <option value="gantt">甘特图</option>
          <option value="sequence">时序图</option>
          <option value="pie">饼图</option>
          <option value="xychart">XY 图</option>
        </select>
      </div>
      <textarea id="src" spellcheck="false" aria-label="Mermaid 源码"></textarea>
    </section>
    <div class="result-col">
      <section class="card before">
        <div class="panel-head"><h2>原始 Mermaid</h2><span class="state" id="stateBefore">—</span></div>
        <div id="before" class="mermaid-block"></div>
      </section>
      <section class="card after" id="markmapPanel">
        <div class="panel-head">
          <h2 id="afterTitle">修复后</h2>
          <div class="panel-actions">
            <button type="button" id="fit">适应视图</button>
            <button type="button" id="fullscreen">全屏查看</button>
            <button type="button" id="toggleFixedSrc" class="mermaid-fallback-copy" hidden>展示修复后源码</button>
            <span class="state" id="state" role="status">加载中…</span>
          </div>
        </div>
        <div id="out" class="mermaid-block"></div>
        <div id="fixedSrcPanel" class="fixed-src-panel" hidden>
          <button type="button" id="copyFixedSrc" class="mermaid-fallback-copy">复制代码</button>
          <pre id="fixedSrc" class="mermaid-fallback-code"></pre>
        </div>
        <ul id="log"></ul>
      </section>
    </div>
  </div>
</main>

<script type="module">
import mermaid from '../node_modules/mermaid/dist/mermaid.esm.min.mjs';
import { fixMermaid } from '../src/fixMermaid.js';

const $ = (id) => document.getElementById(id);
const { Transformer, Markmap } = window.markmap;
const transformer = new Transformer([]);
mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', suppressErrorRendering: true, theme: 'default' });
let view = null, lastCode = '', seq = 0;
const mindmapExample = `mindmap
# 郑钦文2026年10月动态
## 中网夺冠高光
- 10月11日决赛2-0击败安德列娃[2]
- 生涯首座WTA1000冠军
- 中网20届首位本土女单冠军
- 排名从第54位升至第23位[2]
- 锁定2027澳网种子席位[1][18]
## 连续退赛与赛季收官
- 10月12日退出武汉网球公开赛[5]
- 10月15日退出大阪站
- 10月18日退出香港站
- 10月19日确认赛季提前结束
- 右肩旧伤复发叠加身体疲劳
## 伤病背景与教训
- 2025年7月右肘关节手术
- 2026年6月排名跌至第160位
- 吸取仓促复出导致伤情反复教训
- 从硬撑到主动止损的策略转变
## 冬训与2027赛季展望
- 赴西班牙巴塞罗那开启冬训
- 系统康复右肩与体能储备
- 双教练团队打磨发球与反手
- 父亲喊话明年大满贯必须拿下
- 以健康状态冲击澳网与大满贯`;

function log(items) {
  $('log').replaceChildren();
  for (const text of items) { const li = document.createElement('li'); li.textContent = text; $('log').append(li); }
}
function sourceResult(code) {
  lastCode = code; $('fixedSrc').textContent = code;
  $('toggleFixedSrc').hidden = !code;
  $('fixedSrcPanel').hidden = true; $('toggleFixedSrc').textContent = '展示修复后源码';
}
async function renderOriginal(source) {
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-100000px;width:1200px;visibility:hidden;';
  host.setAttribute('aria-hidden', 'true'); document.body.append(host);
  try {
    const { svg } = await mermaid.render(`demo-original-${++seq}`, source, host);
    $('before').innerHTML = svg; $('stateBefore').textContent = '原文可渲染';
  } catch {
    const badge = document.createElement('span'); badge.className = 'mermaid-syntax-error';
    badge.textContent = '语法错误'; $('before').replaceChildren(badge);
    $('stateBefore').textContent = '原文渲染失败';
  } finally { host.remove(); }
}
async function preview() {
  const source = $('src').value;
  $('render').disabled = true; $('sample').disabled = true;
  $('state').textContent = '修复中…'; $('out').dataset.state = 'pending';
  view?.destroy(); view = null; $('out').replaceChildren(); sourceResult(''); log([]);
  try {
    await renderOriginal(source);
    // Manual tool preview: one button click = one fixMermaid call. No business retry loop.
    const result = fixMermaid(source);
    if (!result.ok) throw new Error(result.error);
    sourceResult(result.code);
    if (result.format === 'mermaid') {
      // 流程图、甘特图、时序图、饼图、XY 图保留原生 Mermaid，由 Mermaid 自己渲染。
      $('afterTitle').textContent = '修复后 · 图表';
      const { svg } = await mermaid.render(`demo-fixed-${++seq}`, result.mermaid);
      $('out').innerHTML = svg;
      $('state').textContent = '原生图表已修复';
      $('out').dataset.state = 'ok';
      log(result.fixes);
      return;
    }
    $('afterTitle').textContent = '修复后 · 脑图';
    const { root } = transformer.transform(result.markdown ?? result.code);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    // Numeric SVG dimensions keep zoom/fullscreen transitions valid in file:// pages too.
    svg.setAttribute('width', String($('out').clientWidth));
    svg.setAttribute('height', String($('out').clientHeight));
    $('out').append(svg);
    view = Markmap.create(svg, { duration: 0, initialExpandLevel: -1, maxWidth: 600, spacingHorizontal: 80, spacingVertical: 10 });
    await view.setData(root); await view.fit();
    $('state').textContent = '修复成功'; $('out').dataset.state = 'ok';
    log(result.fixes);
  } catch (error) {
    view?.destroy(); view = null;
    const badge = document.createElement('span'); badge.className = 'mermaid-syntax-error';
    badge.textContent = '语法错误'; $('out').replaceChildren(badge);
    $('state').textContent = '转换失败'; $('out').dataset.state = 'error';
    log([String(error?.message ?? error)]);
  } finally { $('render').disabled = false; $('sample').disabled = false; }
}
const examples = {
  flowchart: `graph TD
    A["开始"] --> B{"是否下雨?"}
    B -->|"是"| C["带雨伞"]
    B -->|"否"| D["不用带伞"]
    C --> E["出门"]
    D --> E["出门"]`,
  gantt: `gantt
    title "项目开发计划"
    dateFormat  YYYY-MM-DD
    section "设计阶段"
    "需求分析"        :a1, 2024-01-01, 5d
    "UI设计"          :a2, after a1, 7d
    section "开发阶段"
    "前端开发"        :b1, after a2, 10d
    "后端开发"        :b2, after a2, 12d
    section "测试阶段"
    "集成测试"        :c1, after b2, 5d`,
  sequence: `sequenceDiagram
    participant 用户
    participant 前端
    participant 服务器
    用户->>前端: "提交登录请求"
    前端->>服务器: "发送账号密码"
    服务器-->>前端: "返回验证结果"
    前端-->>用户: "显示登录成功"`,
  pie: `pie title "各部门人数占比"
    "研发部" : 45
    "市场部" : 20
    "销售部" : 25
    "行政部" : 10`,
  xychart: `xychart-beta
    title "月度销售额"
    x-axis ["一月", "二月", "三月", "四月", "五月"]
    y-axis "销售额(万元)" 0 --> 100
    bar [30, 45, 60, 50, 80]
    line [30, 45, 60, 50, 80]`
};
$('render').onclick = preview;
$('sample').onclick = () => { $('src').value = mindmapExample; preview(); };
$('example').onchange = () => {
  const picked = examples[$('example').value];
  if (!picked) return;
  $('src').value = picked;
  $('example').value = '';
  preview();
};
$('toggleFixedSrc').onclick = () => {
  $('fixedSrcPanel').hidden = !$('fixedSrcPanel').hidden;
  $('toggleFixedSrc').textContent = $('fixedSrcPanel').hidden ? '展示修复后源码' : '隐藏源码';
};
$('copyFixedSrc').onclick = async () => {
  try { await navigator.clipboard.writeText(lastCode); $('copyFixedSrc').textContent = '已复制'; }
  catch { $('copyFixedSrc').textContent = '请手动选择下方源码复制'; }
  setTimeout(() => { $('copyFixedSrc').textContent = '复制代码'; }, 1500);
};
function fitView() {
  const svg = $('out').querySelector('svg');
  if (!view || !svg) return;
  svg.setAttribute('width', String($('out').clientWidth));
  svg.setAttribute('height', String($('out').clientHeight));
  return view.fit();
}
$('fit').onclick = fitView;
$('fullscreen').onclick = async () => {
  if (document.fullscreenElement) await document.exitFullscreen();
  else await $('markmapPanel').requestFullscreen();
};
document.addEventListener('fullscreenchange', () => {
  $('fullscreen').textContent = document.fullscreenElement ? '退出全屏' : '全屏查看';
});
let resizeTimer;
new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitView, 100); }).observe($('out'));
$('src').value = mindmapExample;
await preview();
</script>
</body>
</html>
